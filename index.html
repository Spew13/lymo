<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lymo – Full Featured Video Sharing</title>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<style>
/* ---------------------- GLOBAL ---------------------- */
:root{
  --bg:#0c0c0c;
  --card:#111;
  --accent:#00ff55;
  --muted:#aaa;
  --text:#eee;
  --hover:#22ff88;
  --border:#333;
  --shadow:0 4px 20px rgba(0,255,85,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,Arial,Helvetica,sans-serif;}
body{background:var(--bg);color:var(--text);}
h1,h2,h3,h4,h5,h6{color:var(--accent);}
button,input,textarea{font-family:inherit;}
button{cursor:pointer;}
.hidden{display:none;}
a{text-decoration:none;color:var(--accent);}
a:hover{color:var(--hover);}

/* ---------------------- HEADER ---------------------- */
header{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:var(--card);box-shadow:var(--shadow);}
header h1{font-size:1.6rem;}
#nav-links button{margin-left:12px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);}
#nav-links button:hover{background:var(--hover);border-color:var(--hover);color:#000;}

/* ---------------------- MAIN ---------------------- */
main{padding:16px;display:flex;flex-direction:column;gap:24px;max-width:1200px;margin:auto;}
.card{background:var(--card);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);}
input,textarea{width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);margin-top:8px;}
textarea{resize:none;}
#upload-section button,#feed button,.like-btn,.sub-btn{margin-top:8px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);}
#upload-section button:hover,#feed button:hover,.like-btn:hover,.sub-btn:hover{background:var(--hover);border-color:var(--hover);color:#000;}

/* ---------------------- VIDEO GRID ---------------------- */
#feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;}
.video-card video{width:100%;border-radius:8px;background:#000;}
.video-meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
.video-meta .title{font-weight:bold;}

/* ---------------------- ACCOUNT ---------------------- */
#account-info{display:flex;flex-direction:column;gap:8px;}

/* ---------------------- SUBSCRIPTIONS ---------------------- */
#subs-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.sub-card{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#111;border-radius:8px;box-shadow:var(--shadow);}

/* ---------------------- RESPONSIVE ---------------------- */
@media(max-width:640px){header{flex-direction:column;gap:8px;}main{padding:8px;}}
</style>
</head>
<body>
<header>
<h1>Lymo 🎞️</h1>
<div id="nav-links">
<button id="feed-btn">Feed</button>
<button id="upload-btn-tab">Upload</button>
<button id="subs-btn">Subscriptions</button>
<button id="account-btn">Account</button>
<button id="signin-btn">Sign In / Sign Up</button>
<button id="signout-btn" class="hidden">Sign Out</button>
</div>
</header>

<main>
<!-- ------------------- FEED ------------------- -->
<section id="feed-section" class="card">
<h2>Feed</h2>
<div id="feed">Loading videos...</div>
</section>

<!-- ------------------- UPLOAD ------------------- -->
<section id="upload-section" class="card hidden">
<h2>Upload Video</h2>
<input id="video-title" placeholder="Video Title">
<textarea id="video-desc" rows="3" placeholder="Video Description"></textarea>
<input type="file" id="video-file" accept="video/*">
<button id="upload-btn">Upload</button>
<div id="upload-status"></div>
</section>

<!-- ------------------- SUBSCRIPTIONS ------------------- -->
<section id="subs-section" class="card hidden">
<h2>Subscriptions</h2>
<div id="subs-list">Loading...</div>
</section>

<!-- ------------------- ACCOUNT ------------------- -->
<section id="account-section" class="card hidden">
<h2>Account</h2>
<div id="account-info">
<span id="acc-email">Email: </span>
<span id="acc-uid">UID: </span>
</div>
</section>
</main>

<template id="video-template">
<div class="video-card card">
<video controls playsinline></video>
<div class="video-meta">
<span class="title"></span>
<span class="uploader"></span>
</div>
<div class="video-stats">
<button class="like-btn">♡ <span class="like-count">0</span></button>
<span class="views-count">0 views</span>
</div>
<p class="desc"></p>
<button class="sub-btn">Subscribe</button>
</div>
</template>

<template id="sub-template">
<div class="sub-card card">
<span class="sub-email"></span>
<button class="sub-btn">Subscribe</button>
</div>
</template>

<script type="module">
// -------------------- SUPABASE INIT --------------------
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const SUPABASE_URL = 'https://ljquaamdmtxvdbvxrvbe.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqcXVhYW1kbXR4dmRidnhydmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2MDc5NDksImV4cCI6MjA3NjE4Mzk0OX0.jUyfVDoNnfzSN961WqKpN7rXnM_QfhPFWkL_bmd6XHc'
const supabase = createClient(SUPABASE_URL,SUPABASE_ANON_KEY)

// -------------------- ELEMENTS --------------------
const feedSection = document.getElementById('feed-section')
const uploadSection = document.getElementById('upload-section')
const subsSection = document.getElementById('subs-section')
const accountSection = document.getElementById('account-section')

const feedBtn = document.getElementById('feed-btn')
const uploadBtnTab = document.getElementById('upload-btn-tab')
const subsBtn = document.getElementById('subs-btn')
const accountBtn = document.getElementById('account-btn')
const signinBtn = document.getElementById('signin-btn')
const signoutBtn = document.getElementById('signout-btn')

const videoTitle = document.getElementById('video-title')
const videoDesc = document.getElementById('video-desc')
const videoFile = document.getElementById('video-file')
const uploadBtn = document.getElementById('upload-btn')
const uploadStatus = document.getElementById('upload-status')

const feedContainer = document.getElementById('feed')
const subsList = document.getElementById('subs-list')
const accEmail = document.getElementById('acc-email')
const accUID = document.getElementById('acc-uid')

const videoTemplate = document.getElementById('video-template')
const subTemplate = document.getElementById('sub-template')

// -------------------- NAVIGATION --------------------
function hideAllSections(){feedSection.classList.add('hidden');uploadSection.classList.add('hidden');subsSection.classList.add('hidden');accountSection.classList.add('hidden');}
feedBtn.onclick=()=>{hideAllSections();feedSection.classList.remove('hidden');loadFeed()}
uploadBtnTab.onclick=()=>{hideAllSections();uploadSection.classList.remove('hidden')}
subsBtn.onclick=()=>{hideAllSections();subsSection.classList.remove('hidden');loadSubs()}
accountBtn.onclick=()=>{hideAllSections();accountSection.classList.remove('hidden')}

// -------------------- AUTH --------------------
let currentUser = null
async function authCheck(){
  const { data } = await supabase.auth.getUser()
  currentUser = data.user
  if(currentUser){signinBtn.classList.add('hidden');signoutBtn.classList.remove('hidden');accEmail.textContent='Email: '+currentUser.email;accUID.textContent='UID: '+currentUser.id}
  else{signinBtn.classList.remove('hidden');signoutBtn.classList.add('hidden');accEmail.textContent='Email: ';accUID.textContent='UID: '}
}
signinBtn.onclick=async()=>{
  const email=prompt('Enter your email:')
  if(!email) return
  const { error } = await supabase.auth.signInWithOtp({email})
  if(error) alert('Error:'+error.message)
  else alert('Check your email to sign in!')
}
signoutBtn.onclick=async()=>{await supabase.auth.signOut();authCheck()}

supabase.auth.onAuthStateChange(()=>authCheck())
authCheck()

// -------------------- VIDEO UPLOAD --------------------
uploadBtn.onclick=async()=>{
  if(!videoFile.files[0]){uploadStatus.textContent='Select a file';return;}
  if(!videoTitle.value){uploadStatus.textContent='Enter a title';return;}
  uploadStatus.textContent='Uploading...'
  const file=videoFile.files[0]
  const fileName=Date.now()+'_'+file.name
  const { data, error: uploadError }=await supabase.storage.from('videos').upload(fileName,file)
  if(uploadError){uploadStatus.textContent='Upload failed:'+uploadError.message;return;}
  // insert into DB
  const { error: dbErr }=await supabase.from('videos').insert([{filename:fileName,title:videoTitle.value,description:videoDesc.value,uploader:currentUser.id}])
  if(dbErr){uploadStatus.textContent='Metadata save failed:'+dbErr.message;return;}
  uploadStatus.textContent='Upload complete!'
  videoTitle.value='';videoDesc.value='';videoFile.value=''
  loadFeed()
}

// -------------------- LOAD FEED --------------------
async function loadFeed(){
  feedContainer.innerHTML='Loading...'
  const { data: videos, error }=await supabase.from('videos').select('*').order('created_at',{ascending:false})
  if(error){feedContainer.textContent='Error loading videos: '+error.message;return;}
  feedContainer.innerHTML=''
  for(const v of videos){
    const clone=videoTemplate.content.cloneNode(true)
    const videoEl=clone.querySelector('video')
    const titleEl=clone.querySelector('.title')
    const uploaderEl=clone.querySelector('.uploader')
    const likeBtn=clone.querySelector('.like-btn')
    const likeCount=clone.querySelector('.like-count')
    const viewsCount=clone.querySelector('.views-count')
    const descEl=clone.querySelector('.desc')
    const subBtn=clone.querySelector('.sub-btn')
    const { data: urlData }=supabase.storage.from('videos').getPublicUrl(v.filename)
    videoEl.src=urlData.publicUrl
    titleEl.textContent=v.title
    uploaderEl.textContent='Uploader: '+v.uploader
    descEl.textContent=v.description||''
    // Likes
    const { data: likes }=await supabase.from('video_likes').select('*').eq('video_id',v.id)
    likeCount.textContent=likes.length
    likeBtn.onclick=async()=>{
      if(!currentUser){alert('Sign in first');return;}
      const existing=likes.find(l=>l.user_id===currentUser.id)
      if(existing){
        await supabase.from('video_likes').delete().eq('id',existing.id)
      }else{
        await supabase.from('video_likes').insert([{video_id:v.id,user_id:currentUser.id}])
      }
      loadFeed()
    }
    // Views increment on play
    videoEl.onplay=async()=>{
      if(!currentUser) return
      await supabase.from('video_views').insert([{video_id:v.id,user_id:currentUser.id,viewed_at:new Date()}])
      const { data: views }=await supabase.from('video_views').select('*').eq('video_id',v.id)
      viewsCount.textContent=views.length+' views'
    }
    // Subscriptions
    const { data: subs }=await supabase.from('subscriptions').select('*').eq('subscriber_id',currentUser?.id)
    const subscribed=subs?.some(s=>s.subscribed_to_id===v.uploader)
    subBtn.textContent=subscribed?'Subscribed':'Subscribe'
    subBtn.onclick=async()=>{
      if(!currentUser){alert('Sign in first');return;}
      if(subscribed){
        await supabase.from('subscriptions').delete().eq('subscriber_id',currentUser.id).eq('subscribed_to_id',v.uploader)
      }else{
        await supabase.from('subscriptions').insert([{subscriber_id:currentUser.id,subscribed_to_id:v.uploader}])
      }
      loadFeed()
    }
    feedContainer.appendChild(clone)
  }
}

// -------------------- SUBSCRIPTIONS --------------------
async function loadSubs(){
  subsList.innerHTML='Loading...'
  const { data: users, error }=await supabase.from('users').select('*').neq('id',currentUser?.id)
  if(error){subsList.textContent='Error:'+error.message;return;}
  subsList.innerHTML=''
  for(const u of users){
    const clone=subTemplate.content.cloneNode(true)
    clone.querySelector('.sub-email').textContent=u.email
    const btn=clone.querySelector('.sub-btn')
    const { data: subs }=await supabase.from('subscriptions').select('*').eq('subscriber_id',currentUser?.id)
    const isSub=subs?.some(s=>s.subscribed_to_id===u.id)
    btn.textContent=isSub?'Subscribed':'Subscribe'
    btn.onclick=async()=>{
      if(isSub){
        await supabase.from('subscriptions').delete().eq('subscriber_id',currentUser.id).eq('subscribed_to_id',u.id)
      }else{
        await supabase.from('subscriptions').insert([{subscriber_id:currentUser.id,subscribed_to_id:u.id}])
      }
      loadSubs()
    }
    subsList.appendChild(clone)
  }
}
</script>
</body>
</html>
