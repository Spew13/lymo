<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lymo</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="config.js"></script>
  <script type="module" src="app.js" defer></script>
</head>
<body>
  <!-- Header / Navigation -->
  <header>
    <div class="logo">Lymo</div>
    <nav class="main-nav">
      <button id="feedBtn" class="nav-btn">Feed</button>
      <button id="uploadBtn" class="nav-btn">Upload</button>
      <button id="subsBtn" class="nav-btn">Subscriptions</button>
      <button id="accountBtn" class="nav-btn">Account</button>
    </nav>
    <div class="user-panel">
      <span id="userEmail"></span>
      <button id="signOutBtn" class="action-btn hidden">Sign Out</button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Video Feed Section -->
    <section id="feedSection" class="section active">
      <h2>Video Feed</h2>
      <div id="videoFeed" class="video-grid">
        <!-- Video cards dynamically inserted here -->
      </div>
      <button id="loadMoreBtn" class="load-more">Load More</button>
    </section>

    <!-- Subscriptions Section -->
    <section id="subsSection" class="section hidden">
      <h2>Subscriptions</h2>
      <div id="subsFeed" class="video-grid">
        <!-- Videos from subscribed channels -->
      </div>
    </section>

    <!-- Account Section -->
    <section id="accountSection" class="section hidden">
      <h2>Account</h2>
      <div class="account-info">
        <p>Email: <span id="accountEmail"></span></p>
        <p>Subscribed Channels:</p>
        <ul id="subscribedChannels">
          <!-- List of channels dynamically inserted -->
        </ul>
      </div>
    </section>
  </main>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal hidden">
    <div class="modal-content">
      <h2>Upload Video</h2>
      <input type="text" id="videoTitle" placeholder="Video Title">
      <textarea id="videoDescription" placeholder="Description"></textarea>
      <input type="file" id="videoFile" accept="video/*">
      <div class="upload-options">
        <label>
          <input type="checkbox" id="isPublic" checked>
          Public
        </label>
      </div>
      <div class="modal-actions">
        <button id="confirmUploadBtn" class="action-btn">Upload</button>
        <button id="closeUploadModal" class="action-btn secondary">Cancel</button>
      </div>
      <div id="uploadStatus"></div>
    </div>
  </div>

  <!-- Authentication Modal -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <h2>Sign In / Sign Up</h2>
      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Password">
      <div class="modal-actions">
        <button id="signInBtn" class="action-btn">Sign In</button>
        <button id="signUpBtn" class="action-btn secondary">Sign Up</button>
        <button id="closeAuthModal" class="action-btn tertiary">Cancel</button>
      </div>
      <div id="authStatus"></div>
    </div>
  </div>

  <!-- Video Card Template -->
  <template id="videoCardTemplate">
    <div class="video-card">
      <video controls class="video-player"></video>
      <div class="video-info">
        <h3 class="video-title"></h3>
        <p class="video-channel"></p>
        <div class="video-stats">
          <span class="views">0 views</span>
          <span class="likes">0 likes</span>
        </div>
      </div>
      <div class="video-actions">
        <button class="likeBtn">Like</button>
        <button class="subscribeBtn">Subscribe</button>
      </div>
    </div>
  </template>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="hidden">
    <p>Loading...</p>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Lymo – All rights reserved</p>
  </footer>
</body>
</html>
